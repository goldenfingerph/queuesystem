name: Docker image build

on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - 'package.json'
      - 'package-lock.json'
      - 'server/**'
      - 'src/**'
      - 'shared/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build production Docker image
        run: docker build --tag infinity-queuesystem:ci .
