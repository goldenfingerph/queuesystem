name: Verify local LAN queue system
run-name: Verify ${{ github.event_name }} on ${{ github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from reviewed security overrides
        run: npm install --package-lock-only --ignore-scripts
      - name: Install locked dependencies
        run: npm ci
      - name: Apply compatible npm security fixes
        run: npm audit fix
      - name: Report npm security audit details
        continue-on-error: true
        shell: pwsh
        run: |
          npm audit --json > npm-audit.json
          node -e "const a=JSON.parse(require('fs').readFileSync('npm-audit.json','utf8')); console.log('Vulnerability totals:', JSON.stringify(a.metadata?.vulnerabilities ?? {})); for (const [name,v] of Object.entries(a.vulnerabilities ?? {})) console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==='string'?x:{name:x.name,title:x.title,url:x.url,range:x.range})}));"
      - name: Enforce clean npm security audit
        run: npm audit
      - name: Upload audited lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audited-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Type-check frontend and server
        run: npm run typecheck
      - name: Build production frontend
        run: npm run build
      - name: Run backend route and database regression tests
        run: npm run test:backend
      - name: Validate Windows kiosk PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/Start-QueueKiosk.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; throw "Kiosk startup PowerShell syntax validation failed." }
          Write-Host "Kiosk startup PowerShell syntax is valid."

      - name: Lint frontend and backend
        run: npm run lint
      - name: Package Windows 11 project bundle
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP "QueueSystem-Windows"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          # Stage the complete application, Windows-built dependencies, and production frontend.
          robocopy . $packageDir /E /XD .git .github node_modules/.cache server\data server\certs server\public\ads /XF npm-audit.json .env .env.local .env.*
          $robocopyExit = $LASTEXITCODE
          if ($robocopyExit -ge 8) { throw "Failed to stage Windows package (robocopy exit $robocopyExit)" }
          $global:LASTEXITCODE = 0

          # Keep the audited lockfile produced by this workflow.
          Copy-Item -Path "package-lock.json" -Destination (Join-Path $packageDir "package-lock.json") -Force

          # Bundle the exact Node.js 22 x64 runtime used to build and validate native modules.
          $nodeVersion = (node -p "process.versions.node").Trim()
          if ($nodeVersion -notmatch '^22\.') { throw "Expected Node.js 22.x, got $nodeVersion" }
          $nodeArchiveName = "node-v$nodeVersion-win-x64.zip"
          $nodeBaseUrl = "https://nodejs.org/dist/v$nodeVersion"
          $nodeArchive = Join-Path $env:RUNNER_TEMP $nodeArchiveName
          $nodeSums = Join-Path $env:RUNNER_TEMP "SHASUMS256.txt"
          Invoke-WebRequest -Uri "$nodeBaseUrl/$nodeArchiveName" -OutFile $nodeArchive
          Invoke-WebRequest -Uri "$nodeBaseUrl/SHASUMS256.txt" -OutFile $nodeSums
          $checksumMatch = Select-String -Path $nodeSums -Pattern ("^([0-9a-fA-F]{64})\s+\*?" + [regex]::Escape($nodeArchiveName) + "$") | Select-Object -First 1
          if (-not $checksumMatch) { throw "Official Node.js SHA-256 checksum not found for $nodeArchiveName" }
          $expectedHash = $checksumMatch.Matches[0].Groups[1].Value.ToUpperInvariant()
          $actualHash = (Get-FileHash -Path $nodeArchive -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) { throw "Node.js runtime archive SHA-256 verification failed." }
          $nodeExtract = Join-Path $env:RUNNER_TEMP "node-runtime-extract"
          Expand-Archive -Path $nodeArchive -DestinationPath $nodeExtract -Force
          $nodeHome = Join-Path $packageDir "runtime\node"
          New-Item -ItemType Directory -Force -Path $nodeHome | Out-Null
          Copy-Item -Path (Join-Path $nodeExtract "node-v$nodeVersion-win-x64\*") -Destination $nodeHome -Recurse -Force
          if (-not (Test-Path (Join-Path $nodeHome "node.exe")) -or -not (Test-Path (Join-Path $nodeHome "npm.cmd"))) {
            throw "Bundled Node.js runtime is incomplete (node.exe/npm.cmd missing)."
          }

          # Fail the build if any required application component is missing.
          $requiredPaths = @(
            (Join-Path $packageDir "node_modules\tsx\dist\cli.mjs"),
            (Join-Path $packageDir "node_modules\better-sqlite3"),
            (Join-Path $packageDir "dist\index.html"),
            (Join-Path $packageDir "server\index.ts"),
            (Join-Path $packageDir "package-lock.json"),
            (Join-Path $packageDir "INSTALL-INFINITY-SERVICES.bat"),
            (Join-Path $packageDir "START-INFINITY-SERVICES.bat"),
            (Join-Path $packageDir "scripts\Start-QueueKiosk.ps1"),
            (Join-Path $packageDir "scripts\Start-QueueKiosk.vbs"),
            (Join-Path $packageDir "WINDOWS-AUTO-RECOVERY-GUIDE.md"),
            (Join-Path $packageDir "RESTORE-INFINITY-BACKUP.bat"),
            (Join-Path $packageDir "runtime\node\node.exe"),
            (Join-Path $packageDir "runtime\node\npm.cmd")
          )
          foreach ($requiredPath in $requiredPaths) {
            if (-not (Test-Path $requiredPath)) { throw "Required package component missing: $requiredPath" }
          }

          # Verify the bundled runtime, npm, and Windows native SQLite binding.
          $env:PATH = "$nodeHome;$env:PATH"
          Push-Location $packageDir
          try {
            node -e "if (Number(process.versions.node.split('.')[0]) !== 22) process.exit(2); require('better-sqlite3'); console.log('Bundled Node.js', process.versions.node, '- better-sqlite3 native binding loaded.');"
            if ($LASTEXITCODE -ne 0) { throw "Bundled Node.js or better-sqlite3 validation failed." }
            npm --version
            if ($LASTEXITCODE -ne 0) { throw "Bundled npm validation failed." }
          } finally {
            Pop-Location
          }

          # Never ship secrets, live databases, TLS private keys, or local advertisement media.
          $forbiddenPaths = @(".env", ".env.local", "server\data", "server\certs", "server\public\ads")
          foreach ($relativePath in $forbiddenPaths) {
            if (Test-Path (Join-Path $packageDir $relativePath)) { throw "Refusing to package excluded local/private content: $relativePath" }
          }

          $expandedBytes = (Get-ChildItem -LiteralPath $packageDir -Recurse -File -Force | Measure-Object -Property Length -Sum).Sum
          $expandedMB = [math]::Round($expandedBytes / 1MB, 1)
          $nodeVersion = node --version
          $buildInfo = @"
          QUEUE SYSTEM - WINDOWS 11 SELF-CONTAINED PROJECT BUNDLE
          Source commit: $env:GITHUB_SHA
          Bundled runtime: Node.js $nodeVersion (Windows x64) with npm
          Expanded package size: $expandedMB MB
          Includes: production frontend, backend source, audited dependencies, native SQLite binding, bundled Node.js/npm runtime, and Windows launchers.
          Excludes: .env secrets, local databases/backups, TLS private keys, and local ad media.
          "@
          Set-Content -Path (Join-Path $packageDir "PACKAGE-BUILD-INFO.txt") -Value $buildInfo -Encoding UTF8

          $readme = @'
          QUEUE SYSTEM - WINDOWS 11 SELF-CONTAINED PROJECT PACKAGE

          REQUIREMENTS
          - Windows 10/11 64-bit.
          - Node.js 22 x64 and npm are included in runtime\node; no system-wide Node.js installation is required.
          - Internet is needed only if bundled dependencies fail validation and npm ci fallback is required.

          FIRST RUN
          1. Extract the complete downloaded ZIP to a writable folder, e.g. C:\QueueSystem.
          2. Double-click INSTALL-INFINITY-SERVICES.bat.
          3. Double-click START-INFINITY-SERVICES.bat.
          4. On this PC, open http://localhost:4000.
          5. From another device on the same private LAN, open http://<SERVER-IP>:4000.
          6. Keep the server command window open while using the system.

          DATABASE RESTORE
          Stop the server first. Keep a separate copy of the current database.
          Put the selected backup inside server\data\backups and run
          RESTORE-INFINITY-BACKUP.bat. Never restore over a live database.

          DATA SAFETY
          The application creates its local SQLite database under server\data.
          This package intentionally excludes local databases, backups, secrets,
          TLS private keys, and local advertisement media. Do not extract over an
          existing live installation or production data folder.

          SECURITY
          Default LAN mode is HTTP/WS and is not encrypted. Use only on a trusted private
          network for testing. Configure trusted TLS certificates before exposing it
          beyond a private test LAN. PWA installation on other LAN devices requires HTTPS.

          This is a Windows project test package, not a signed commercial EXE
          or an independently verified production deployment.
          '@
          Set-Content -Path (Join-Path $packageDir "WINDOWS-11-TEST-INSTRUCTIONS.txt") -Value $readme -Encoding UTF8

          $zipPath = Join-Path $env:RUNNER_TEMP "QueueSystem-Windows11-Project.zip"
          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath $zipPath -CompressionLevel Optimal
          $zip = Get-Item $zipPath
          Write-Host "Expanded package size: $expandedMB MB ($expandedBytes bytes)"
          Write-Host "Project ZIP size: $([math]::Round($zip.Length / 1MB, 1)) MB ($($zip.Length) bytes)"
          Get-FileHash -Path $zipPath -Algorithm SHA256 | Format-List Algorithm,Hash,Path

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows Setup Wizard
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP "QueueSystem-Windows"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          $setupPath = Join-Path $env:RUNNER_TEMP "QueueSystem-Setup.exe"
          & $iscc "/DAppVersion=1.0.0" "/DSourceDir=$packageDir" "/DOutputDir=$env:RUNNER_TEMP" "installer\QueueSystem.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $setupPath)) { throw "Setup Wizard EXE was not created." }
          $setup = Get-Item $setupPath
          Write-Host "Setup EXE size: $([math]::Round($setup.Length / 1MB, 1)) MB ($($setup.Length) bytes)"
          Get-FileHash -Path $setupPath -Algorithm SHA256 | Format-List Algorithm,Hash,Path

      - name: Test installer upgrade preserves customer data
        shell: pwsh
        run: |
          $setupPath = Join-Path $env:RUNNER_TEMP "QueueSystem-Setup.exe"
          $packageDir = Join-Path $env:RUNNER_TEMP "QueueSystem-Windows"
          $testDir = Join-Path $env:RUNNER_TEMP "QueueSystem-Installer-Upgrade-Test"
          if (-not (Test-Path $setupPath)) { throw "Installer EXE missing: $setupPath" }
          if (Test-Path $testDir) { Remove-Item -LiteralPath $testDir -Recurse -Force }
          
          function Invoke-QueueSystemSilentInstall {
            & $setupPath /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- "/DIR=$testDir" /NOICONS
            if ($LASTEXITCODE -ne 0) { throw "Silent installer exited with code $LASTEXITCODE" }
          }

          # First install into an isolated temporary folder on this disposable CI runner.
          Invoke-QueueSystemSilentInstall
          $appInfo = Join-Path $testDir "PACKAGE-BUILD-INFO.txt"
          if (-not (Test-Path $appInfo)) { throw "First install did not copy application files." }
          $expectedAppInfo = Get-Content -LiteralPath $appInfo -Raw

          # Simulate customer-owned files that must survive an in-place upgrade.
          $preservedFiles = @{
            "server\data\infinity.db" = "CI DATABASE SENTINEL - MUST SURVIVE UPGRADE"
            "server\data\company-settings.json" = '{"organization":"CI UPGRADE PRESERVATION TEST","theme":"purple"}'
            "server\certs\server.key" = "CI TLS PRIVATE KEY SENTINEL - MUST SURVIVE UPGRADE"
            "server\public\ads\customer-ad.txt" = "CI CUSTOMER AD SENTINEL - MUST SURVIVE UPGRADE"
          }
          foreach ($relativePath in $preservedFiles.Keys) {
            $destination = Join-Path $testDir $relativePath
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
            Set-Content -LiteralPath $destination -Value $preservedFiles[$relativePath] -NoNewline
          }

          # Change an application-owned file to prove the second install replaces old app files.
          Set-Content -LiteralPath $appInfo -Value "OLD APPLICATION VERSION SENTINEL" -NoNewline
          Invoke-QueueSystemSilentInstall

          foreach ($relativePath in $preservedFiles.Keys) {
            $destination = Join-Path $testDir $relativePath
            if (-not (Test-Path -LiteralPath $destination)) { throw "Upgrade deleted customer data: $relativePath" }
            $actual = Get-Content -LiteralPath $destination -Raw
            if ($actual -cne $preservedFiles[$relativePath]) { throw "Upgrade modified customer data: $relativePath" }
          }
          $upgradedAppInfo = Get-Content -LiteralPath $appInfo -Raw
          if ($upgradedAppInfo -cne $expectedAppInfo) { throw "Upgrade did not replace the old application-owned file." }
          Write-Host "PASS: database, company settings, TLS certificate, and customer ad files survived the upgrade."
          Write-Host "PASS: application-owned files were replaced with the new package version."
          Remove-Item -LiteralPath $testDir -Recurse -Force

      - name: Publish public Windows 11 release candidate assets
        if: ${{ false }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows11-rc-$($env:GITHUB_SHA.Substring(0,7))"
          gh release create $tag `
            "$env:RUNNER_TEMP\QueueSystem-Windows11-Project.zip" `
            "$env:RUNNER_TEMP\QueueSystem-Setup.exe" `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "QueueSystem Windows 11 Release Candidate" `
            --notes "Self-contained Windows 11 x64 setup and project ZIP with bundled Node.js 22 x64/npm runtime and native SQLite dependencies. No system-wide Node.js installation required. Unsigned release candidate; test on a non-production PC and keep existing databases/backups untouched." `
            --prerelease

      - name: Stage final release files
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP "QueueSystem-Windows11-Release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP "QueueSystem-Windows11-Project.zip") $releaseDir
          Copy-Item (Join-Path $env:RUNNER_TEMP "QueueSystem-Setup.exe") $releaseDir
          @"
          QueueSystem Windows 11 installer validation artifact
          Source commit: $env:GITHUB_SHA
          Installer: QueueSystem-Setup.exe (unsigned CI validation build)
          Portable project bundle: QueueSystem-Windows11-Project.zip
          Requires Windows 10/11 x64 only. Node.js 22 x64 and npm are bundled.
          No system-wide Node.js installation is required. Python is not required.
          This artifact is for controlled testing, not a production release.
          "@ | Set-Content (Join-Path $releaseDir "README-FIRST.txt") -Encoding UTF8
          Get-FileHash (Join-Path $releaseDir "QueueSystem-Setup.exe") -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } |
            Set-Content (Join-Path $releaseDir "SHA256SUMS.txt") -Encoding ASCII
          Get-FileHash (Join-Path $releaseDir "QueueSystem-Windows11-Project.zip") -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } |
            Add-Content (Join-Path $releaseDir "SHA256SUMS.txt") -Encoding ASCII

      - name: Upload Windows 11 release bundle
        uses: actions/upload-artifact@v4
        with:
          name: QueueSystem-Windows11-Release
          path: ${{ runner.temp }}/QueueSystem-Windows11-Release/*
          if-no-files-found: error
          retention-days: 30
