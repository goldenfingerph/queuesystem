name: Verify local LAN queue system
run-name: Verify ${{ github.event_name }} on ${{ github.ref_name }}

on:
  push:
    branches: [main, restore-local-sqlite-lan, windows-batch-security-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from reviewed security overrides
        run: npm install --package-lock-only --ignore-scripts
      - name: Install locked dependencies
        run: npm ci
      - name: Apply compatible npm security fixes
        run: npm audit fix
      - name: Report npm security audit details
        continue-on-error: true
        shell: pwsh
        run: |
          npm audit --json > npm-audit.json
          node -e "const a=JSON.parse(require('fs').readFileSync('npm-audit.json','utf8')); console.log('Vulnerability totals:', JSON.stringify(a.metadata?.vulnerabilities ?? {})); for (const [name,v] of Object.entries(a.vulnerabilities ?? {})) console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==='string'?x:{name:x.name,title:x.title,url:x.url,range:x.range})}));"
      - name: Enforce clean npm security audit
        run: npm audit
      - name: Upload audited lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audited-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Type-check frontend and server
        run: npm run typecheck
      - name: Build production frontend
        run: npm run build
      - name: Run backend route and database regression tests
        run: npm run test:backend
      - name: Lint frontend and backend
        run: npm run lint
      - name: Package Windows 11 test bundle
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP "QueueSystem-Windows"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          robocopy . $packageDir /E /XD .git .github node_modules/.cache /XF npm-audit.json
          if ($LASTEXITCODE -ge 8) { throw "Failed to stage Windows package (robocopy exit $LASTEXITCODE)" }
          # Use the exact lockfile validated by npm ci and npm audit in this workflow.
          Copy-Item -Path "package-lock.json" -Destination (Join-Path $packageDir "package-lock.json") -Force
          $readme = @'
          QUEUE SYSTEM - WINDOWS 11 TEST PACKAGE

          REQUIREMENTS
          - Windows 10/11 64-bit
          - Node.js 22 LTS (https://nodejs.org/en/download)
          - Internet connection for the first dependency installation

          FIRST RUN
          1. Extract this entire ZIP to a writable folder, e.g. C:\QueueSystem.
          2. Install Node.js 22 LTS if it is not already installed.
          3. Double-click INSTALL-INFINITY-SERVICES.bat and wait for completion.
          4. Double-click START-INFINITY-SERVICES.bat.
          5. On this PC, open http://localhost:4000.
          6. From another device on the same private LAN, open http://<SERVER-IP>:4000.
          7. Keep the server command window open while using the system.

          DATA SAFETY
          The application stores its local SQLite database under server\data by default.
          Back up that folder before replacing or reinstalling an existing instance.
          Do not extract over an existing live installation or production data folder.

          SECURITY
          Default LAN mode is HTTP/WS and is not encrypted. Use only on a trusted private
          network for testing. Configure trusted TLS certificates before exposing it
          beyond a private test LAN. PWA installation on other LAN devices requires HTTPS.

          This is a Windows test bundle, not a signed commercial installer or an
          independently verified production deployment.
          '@
          Set-Content -Path (Join-Path $packageDir "WINDOWS-11-TEST-INSTRUCTIONS.txt") -Value $readme -Encoding UTF8
          $zipPath = Join-Path $env:RUNNER_TEMP "QueueSystem-Windows11-Test.zip"
          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath $zipPath -CompressionLevel Optimal
          Get-Item $zipPath | Format-List FullName,Length
      - name: Upload Windows 11 test package
        uses: actions/upload-artifact@v4
        with:
          name: QueueSystem-Windows11-Test
          path: ${{ runner.temp }}/QueueSystem-Windows11-Test.zip
          if-no-files-found: error
          retention-days: 30
