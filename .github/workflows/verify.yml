name: Verify local LAN queue system

on:
  push:
    branches: [main, restore-local-sqlite-lan, windows-batch-security-hardening]
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Report npm security audit details
        continue-on-error: true
        shell: pwsh
        run: |
          npm audit --json > npm-audit.json
          node -e "const a=JSON.parse(require('fs').readFileSync('npm-audit.json','utf8')); console.log('Vulnerability totals:', JSON.stringify(a.metadata?.vulnerabilities ?? {})); for (const [name,v] of Object.entries(a.vulnerabilities ?? {})) console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==='string'?x:{name:x.name,title:x.title,url:x.url,range:x.range})}));"
      - name: Type-check frontend and server
        run: npm run typecheck
      - name: Build production frontend
        run: npm run build
      - name: Run backend route and database regression tests
        run: npm run test:backend
      - name: Lint frontend and backend
        run: npm run lint
